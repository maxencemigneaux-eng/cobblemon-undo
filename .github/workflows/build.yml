name: Compiler le mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extraire le projet envoyé en .zip
        run: |
          if [ -f cobblemon-undo.zip ]; then
            rm -rf /tmp/projet && mkdir -p /tmp/projet
            unzip -o -q cobblemon-undo.zip -d /tmp/projet
            rsync -a --exclude '.github' /tmp/projet/cobblemon-undo/ ./
            git rm -q cobblemon-undo.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Extraction du projet depuis le .zip" || true
            git push || true
          fi
          if [ -f build.gradle ]; then echo "PROJET=ok" >> "$GITHUB_ENV"; else echo "Pas encore de projet : rien à compiler."; fi

      - uses: actions/setup-java@v4
        if: env.PROJET == 'ok'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        if: env.PROJET == 'ok'
        with:
          gradle-version: '8.14.3'

      - name: Trouver la dernière version de Cobblemon 1.8.x
        if: env.PROJET == 'ok'
        id: cobblemon
        run: |
          META_URL="https://maven.impactdev.net/repository/development/com/cobblemon/fabric/maven-metadata.xml"
          curl -fsSL "$META_URL" | grep -o '<version>[^<]*</version>' | sed -e 's/<version>//' -e 's/<\/version>//' > /tmp/versions.txt || true
          echo "Versions disponibles :"; cat /tmp/versions.txt
          V=$(grep -E '^1\.8\.[0-9]+\+1\.21\.1$' /tmp/versions.txt | sort -V | tail -n 1 || true)
          if [ -z "$V" ]; then V=$(grep -E '^1\.8\.[0-9]+\+1\.21\.1' /tmp/versions.txt | sort -V | tail -n 1 || true); fi
          if [ -z "$V" ]; then V="1.8.4+1.21.1"; echo "::warning::Version non trouvée, essai avec $V"; fi
          echo "Version utilisée : $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Compiler
        if: env.PROJET == 'ok'
        run: |
          set -o pipefail
          gradle build --stacktrace -Pcobblemon_version="${{ steps.cobblemon.outputs.version }}" -Pcobblemon_tag="1.8" 2>&1 | tee /tmp/build.log

      - name: Mettre le .jar dans le dossier "telechargement" du dépôt
        if: env.PROJET == 'ok'
        run: |
          git pull -q --rebase || true
          mkdir -p telechargement
          rm -f telechargement/*.jar
          for f in build/libs/*.jar; do case "$f" in *-sources.jar) ;; *) cp "$f" telechargement/;; esac; done
          echo "Compilation réussie (essai n°${{ github.run_number }}) le $(date -u '+%Y-%m-%d %H:%M UTC')" > telechargement/statut.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telechargement
          git commit -q -m "Nouveau .jar compilé (essai n°${{ github.run_number }})" || true
          git push

      - name: Enregistrer l'erreur de compilation
        if: failure() && env.PROJET == 'ok'
        run: |
          touch /tmp/build.log
          git pull -q --rebase || true
          mkdir -p ci
          { echo "ECHEC essai n°${{ github.run_number }}"; echo; grep -nE "error:|warning:|FAILURE|What went wrong|Could not|> " /tmp/build.log | head -n 120; echo; echo "----- fin du log -----"; tail -n 150 /tmp/build.log; } > "ci/erreur-${{ github.run_number }}.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci
          git commit -q -m "Log d'erreur (essai n°${{ github.run_number }})" || true
          git push
